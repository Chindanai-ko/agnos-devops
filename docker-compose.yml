services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: agnos-api
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=DEV
      - PORT=8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - agnos-network

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: agnos-worker
    ports:
      - "9090:9090"
    environment:
      - APP_ENV=DEV
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - agnos-network

networks:
  agnos-network:
    driver: bridge
