services:
  api:
    build:
      context: ./api
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=DEV
      - PORT=8080
    networks:
      - agnos-network

  worker:
    build:
      context: ./worker
    ports:
      - "9090:9090"
    environment:
      - APP_ENV=DEV
    networks:
      - agnos-network

networks:
  agnos-network:
    driver: bridge
