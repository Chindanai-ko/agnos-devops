name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'
        cache: true
        cache-dependency-path: |
          api/go.sum
          worker/go.sum

    - name: Lint API
      run: |
        cd api
        go vet ./...
        
    - name: Lint Worker
      run: |
        cd worker
        go vet ./...

    - name: Test API
      run: cd api && go test -v -race -coverprofile=coverage.out ./...

    - name: Test Worker
      run: cd worker && go test -v -race -coverprofile=coverage.out ./...

  build-and-push:
    name: Build and Push
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build API Image
      uses: docker/build-push-action@v5
      with:
        context: ./api
        push: false
        load: true
        tags: |
          agnos-api:${{ github.sha }}
          agnos-api:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build Worker Image
      uses: docker/build-push-action@v5
      with:
        context: ./worker
        push: false
        load: true
        tags: |
          agnos-worker:${{ github.sha }}
          agnos-worker:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Security Scan API
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'agnos-api:${{ github.sha }}'
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        severity: 'CRITICAL,HIGH'

    - name: Security Scan Worker
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'agnos-worker:${{ github.sha }}'
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        severity: 'CRITICAL,HIGH'

  deploy:
    name: Deploy to Cluster
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
    - uses: actions/checkout@v4

    - name: Set up Kustomize
      uses: imranismail/setup-kustomize@v2

    - name: Validate Manifests (Dry Run)
      run: |
        echo "Validating Kubernetes manifests..."
        # In a real environment, we would use:
        # kubectl apply --dry-run=client -f k8s/
        # Since we don't have a cluster connected, we just check if files exist
        ls -la k8s/*.yaml

    - name: Deploy to Production
      run: |
        echo "Deploying version ${{ github.sha }} to Production..."
        # Actual deployment command:
        # kubectl apply -f k8s/
        # kubectl set image deployment/api-deployment api=agnos-api:${{ github.sha }}
        # kubectl set image deployment/worker-deployment worker=agnos-worker:${{ github.sha }}
        echo "Deployment complete."
