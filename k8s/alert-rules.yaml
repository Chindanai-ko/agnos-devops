groups:
- name: agnos-alerts
  rules:
  - alert: HighErrorRate
    expr: rate(http_requests_total{code=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: "High HTTP error rate on {{ $labels.instance }}"
      description: "Error rate is above 5% for more than 2 minutes."
  - alert: WorkerStalled
    expr: time() - worker_last_success_timestamp_seconds > 3600
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "Worker job stalled"
      description: "Worker has not reported success in the last hour."
  - alert: APIPodCrashLooping
    expr: rate(kube_pod_container_status_restarts_total{pod=~"api-deployment-.*"}[15m]) > 0
    for: 10m
    labels:
      severity: critical
    annotations:
      summary: "API Pod is crash looping"
      description: "API pod {{ $labels.pod }} has restarted multiple times."
